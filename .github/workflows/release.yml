name: Release

# Builds Linux packages once a day and publishes them as a GitHub release.
# Nothing is released when there are no commits since the previous release, so
# an unchanged project stays quiet. Can also be started by hand from the
# Actions tab, optionally forcing a release.
#
# The version of a daily release is "<project version>.<YYYYMMDD>", taken from
# the project() line in the root CMakeLists.txt.

on:
  schedule:
    # Every day at 03:23 UTC.
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Release even when nothing changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for commits since the last release
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          base_version=$(grep -m1 -oP 'project\s*\(\s*[A-Za-z0-9_]+\s+VERSION\s+\K[0-9]+(\.[0-9]+)*' CMakeLists.txt)
          last_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)

          if [ -n "${last_tag}" ]; then
            range="${last_tag}..HEAD"
          else
            range="HEAD"
          fi
          count=$(git rev-list --count "${range}")

          echo "Project version: ${base_version}"
          echo "Previous release: ${last_tag:-<none>}"
          echo "Commits since then: ${count}"

          if [ "${count}" -eq 0 ] && [ "${FORCE:-false}" != "true" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Nothing changed since ${last_tag}, nothing to release."
            exit 0
          fi

          version="${base_version}.$(date -u +%Y%m%d)"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            # A release was already published today, keep the tag unique.
            version="${version}.${GITHUB_RUN_NUMBER}"
            tag="v${version}"
          fi

          {
            echo "changed=true"
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "notes<<NOTES_EOF"
            echo "Automated Linux package build ${version}."
            echo
            if [ -n "${last_tag}" ]; then
              echo "Changes since ${last_tag}:"
              echo
              git log --no-merges --pretty='- %s (%h)' "${range}"
            else
              echo "Commits:"
              echo
              git log --no-merges --pretty='- %s (%h)' -n 40 HEAD
            fi
            echo "NOTES_EOF"
          } >> "${GITHUB_OUTPUT}"

          echo "::notice::Releasing ${tag}"

  deb:
    name: Build .deb
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git gettext extra-cmake-modules \
            qt6-base-dev qt6-declarative-dev \
            libkf6coreaddons-dev libkf6i18n-dev libkf6kirigami-dev \
            libkf6config-dev libkf6crash-dev
          # Kirigami Addons is packaged under different names across releases.
          apt-get install -y --no-install-recommends kirigami-addons-dev \
            || apt-get install -y --no-install-recommends libkf6kirigami-addons-dev

      - name: Collect QML module dependencies
        id: qml
        run: |
          set -eu
          depends=""
          for package in \
            qml6-module-org-kde-kirigami \
            qml6-module-org-kde-kirigamiaddons-formcard \
            qml6-module-org-kde-ki18n \
            qml6-module-org-kde-qqc2desktopstyle \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript \
            qml6-module-qt-labs-platform ; do
            if apt-cache show "${package}" > /dev/null 2>&1; then
              depends="${depends:+${depends}, }${package}"
            else
              echo "::warning::No package named ${package} here, skipping it."
            fi
          done
          echo "depends=${depends}" >> "${GITHUB_OUTPUT}"
          echo "QML dependencies: ${depends}"

      - name: Configure, build and package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eux
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DQTCHATER_PACKAGE_VERSION="${{ needs.check.outputs.version }}" \
            -DQTCHATER_DEBIAN_EXTRA_DEPENDS="${{ steps.qml.outputs.depends }}"
          cmake --build build
          timeout 15 ./build/bin/qtchater || [ $? -eq 124 ]
          cd build
          cpack -G DEB
          ls -l ./*.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: build/*.deb
          if-no-files-found: error

  rpm:
    name: Build .rpm
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eux
          dnf install -y --setopt=install_weak_deps=False \
            cmake ninja-build gcc-c++ git gettext extra-cmake-modules rpm-build \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel \
            kf6-kcoreaddons-devel kf6-ki18n-devel kf6-kirigami-devel \
            kf6-kconfig-devel kf6-kcrash-devel kf6-kirigami-addons-devel

      - name: Configure, build and package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eux
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DQTCHATER_PACKAGE_VERSION="${{ needs.check.outputs.version }}"
          cmake --build build
          timeout 15 ./build/bin/qtchater || [ $? -eq 124 ]
          cd build
          cpack -G RPM
          ls -l ./*.rpm

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: build/*.rpm
          if-no-files-found: error

  release:
    name: Publish release
    needs: [check, deb, rpm]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          set -eux
          ls -l dist
          printf '%s\n' "${NOTES}" > release-notes.md
          gh release create "${TAG}" \
            --title "qtchater ${VERSION}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}" \
            dist/*
